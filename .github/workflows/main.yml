name: A_Evolution_Node_v7

on:
  schedule:
    - cron: '0 * * * *' # 每小時執行一次
  workflow_dispatch:      # 允許手動觸發

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests duckduckgo_search urllib3

      - name: Run A Evolution Core
        run: python sync_handler.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          VOL2_GIST_ID: ${{ secrets.VOL2_GIST_ID }}
          DB_QUERY_RETRY_TOKEN: ${{ secrets.DB_QUERY_RETRY_TOKEN }}
          CORE_LOGIC: ${{ secrets.CORE_LOGIC }}
