name: A-Evolution Memory Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  evolution_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Essential Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread oauth2client duckduckgo-search

      - name: Execute Routine Task
        env:
          # 這裡就是妳剛重建的 Secret 對應
          SYS_ID_01: ${{ secrets.SYS_ID_01 }}
          SYS_ID_02: ${{ secrets.SYS_ID_02 }}
          SYS_ID_03: ${{ secrets.SYS_ID_03 }}
          SYS_ID_04: ${{ secrets.SYS_ID_04 }}
          SYS_ID_05: ${{ secrets.SYS_ID_05 }}
          CORE_LOGIC: ${{ secrets.CORE_LOGIC }} 
        run: |
          python sync_handler.py
